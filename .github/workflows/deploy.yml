name: Deploy Azure Functions

on:
  push:
    # mainブランチへのコード反映をトリガーに自動実行
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # リポジトリの最新コードをGitHub Actions実行環境へチェックアウト
      - name: Checkout Code
        uses: actions/checkout@v4

      # GitHub Secretsの認証情報を使用してAzureへログイン
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 1. Bicepによるインフラ更新
      # アプリを配置する前に、実行基盤（リソース）を最新の定義に同期する
      - name: Deploy Infrastructure (Bicep)
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: RG-Portfolio-Automation
          template: ./main.bicep
          failOnStdErr: false

      # 2. .NET 8 アプリのビルド
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # アプリケーションをコンパイルし、./publish ディレクトリに出力
      - name: Build
        run: dotnet publish Azure.csproj -c Release -o ./publish

      # 3. Azure Functionsへのデプロイ
      # 最新化したインフラ基盤に対して、ビルド済みのバイナリを配備
      - name: Deploy to Azure Functions
        uses: azure/functions-action@v1
        with:
          app-name: 'fn-batch-sim-20260211'
          package: ./publish